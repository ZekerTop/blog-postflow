name: deploy

# Hexo → GitHub Pages（另一个仓库）。Secret：DEPLOY_KEY（线上仓库的 Deploy key 私钥，允许写）
# 从 Windows 本地 hexo d 迁移过来时，restore-mtimes / normalize-eol 两步让构建结果与线上逐字节一致；全新站点可删掉这两步。
# 影子模式：默认只构建 + 与线上逐页比对，不部署。
# 比对报告在 Actions 运行页面的 Summary。确认无误后，在仓库 Settings → Secrets and variables → Actions → Variables
# 新建 DEPLOY_ENABLED=true 才会真正部署（且只部署 main 分支）；部署前比对仍会运行，出现阻断项（页面消失、老文章正文变化、CNAME/robots 变化）就不部署。
# 故意删改文章：把页面写进 .github/allowed-removals.txt（Postflow 删除 / 编辑文章时自动追加）。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  # 主题（如 Icarus）用 toLocaleString() 生成 <time title>：以前在中文系统上构建的站点要设中文 locale，否则每篇文章都会变
  LANG: zh_CN.UTF-8
  LC_ALL: zh_CN.UTF-8
  LIVE_REPO: <owner>/<owner>.github.io   # 线上站点仓库（GitHub Pages）
  CNAME: notes.example.com               # 自定义域名；没有就删掉下面的 cname 一行

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 恢复修改时间要看每篇文章的最后提交时间
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 恢复文章修改时间（「更新于」、dateModified、sitemap lastmod）
        run: node .github/scripts/restore-mtimes.js
      - run: npx hexo clean && npx hexo generate
      - name: 换行符转成 LF（与 Windows 上 hexo d 推送时 git 自动转换一致；非 Windows 迁移可删）
        run: python3 .github/scripts/normalize-eol.py ./public
      - name: 拉取线上站点
        run: git clone --depth 1 --branch main "https://github.com/${LIVE_REPO}.git" .live
      - name: 与线上比对（SEO 守门）
        run: python3 .github/scripts/compare_site.py .live ./public .github/allowed-removals.txt
      - name: 保存构建产物（可下载核对，保留 7 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            ./public
            compare-report.json
          retention-days: 7
      - name: 部署
        if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'   # 只有 main 能上线；测试分支手动运行也不部署
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY }}
          external_repository: ${{ env.LIVE_REPO }}
          publish_branch: main
          publish_dir: ./public
          cname: ${{ env.CNAME }}
          # 不用 force_orphan：保留线上仓库的历史，出问题可以直接退回上一个提交
