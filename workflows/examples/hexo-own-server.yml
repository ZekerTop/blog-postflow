name: deploy

# Hexo → 自己的服务器（git 裸仓库 + post-receive 钩子同步到网站目录）。
# restore-mtimes 让「更新于」不因 git checkout 全部变成同一时刻；放在 .github/scripts/，可选配套 mtimes.json。
# 影子模式：默认只构建 + 与线上逐页比对，不部署。
# 比对报告在 Actions 运行页面的 Summary。确认无误后，在仓库 Settings → Secrets and variables → Actions → Variables
# 新建 DEPLOY_ENABLED=true 才会真正部署（且只部署 main 分支）；部署前比对仍会运行，出现阻断项（页面消失、CNAME/robots 变化）就不部署。
# 故意删文章：把页面写进 .github/allowed-removals.txt（Postflow 删除文章时自动追加）。
# 部署 = 把 public/ 强推到服务器裸仓库 master，服务器 post-receive 钩子同步到网站目录。
# Secrets：DEPLOY_KEY（只能 git 推拉的受限密钥）、SERVER_HOST、SERVER_KNOWN_HOSTS
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  LIVE_REPO: /home/git/blog.git   # 服务器上的裸仓库路径

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # restore-mtimes 依赖 git 历史
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 恢复文章修改时间（页面上的「更新于」）
        run: node .github/scripts/restore-mtimes.js
      - run: npx hexo clean && npx hexo generate
      - name: SSH
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: 拉取线上站点
        run: git clone --depth 1 --branch master "git@${{ secrets.SERVER_HOST }}:${LIVE_REPO}" .live
      - name: 与线上比对（SEO 守门）
        run: python3 .github/scripts/compare_site.py .live ./public .github/allowed-removals.txt
      - name: 保存构建产物（可下载核对，保留 7 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            ./public
            compare-report.json
          retention-days: 7
      - name: 部署
        if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'   # 只有 main 能上线；测试分支手动运行也不部署
        run: |
          cd public
          git init -q -b master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "deploy ${GITHUB_SHA::7}"
          git push -f "git@${{ secrets.SERVER_HOST }}:${LIVE_REPO}" master
