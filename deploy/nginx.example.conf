# Postflow 反代示例。把 postflow.example.com 换成你的域名，证书路径按实际改。
# 注意：有些面板（如宝塔）的全局 proxy.conf 默认开了 proxy_cache 和「出错自动重试」，这里必须关掉：
#   缓存会让接口数据串号；自动重试会把发布请求再发一次。
limit_req_zone $binary_remote_addr zone=postflow_login:1m rate=10r/m;

server {
    listen 80;
    server_name postflow.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/postflow-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name postflow.example.com;

    ssl_certificate     /opt/postflow/cert/fullchain.pem;
    ssl_certificate_key /opt/postflow/cert/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 5m;
    access_log /var/log/nginx/postflow.access.log;
    error_log  /var/log/nginx/postflow.error.log;

    proxy_cache off;
    proxy_next_upstream off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;   # AI 补全、发布到多个仓库可能超过 60 秒

    location ~ ^/api/(login|setup)$ {
        limit_req zone=postflow_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8790;
    }
    location / { proxy_pass http://127.0.0.1:8790; }
}
