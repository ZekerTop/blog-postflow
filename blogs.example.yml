# 可选：复制为 blogs.yml（已在 .gitignore），首次启动时导入一次；之后在网页「设置 → 博客」里增删改。
# 设置页的「从模板填」也读这个文件。新增博客 = 新源码仓库 + workflow + 这里（或设置页）加一段。
# filename / post_url 可用占位符：{slug} {year} {month} {day} {category_dir}
# adapter 填主题预设名（app/adapters/presets.py，设置页下拉可选）；options 里写的同名项覆盖预设，如 fields、date_format。
blogs:
  - id: hexo-butterfly
    name: Hexo · Butterfly
    repo: <owner>/my-hexo-blog
    branch: main
    posts_dir: source/_posts
    filename: "{slug}.md"
    adapter: hexo-butterfly
    post_url: "https://blog.example.com/{year}/{month}/{day}/{slug}/"
  - id: hexo-icarus
    name: Hexo · Icarus
    repo: <owner>/my-icarus-blog
    branch: main
    posts_dir: source/_posts
    filename: "{slug}.md"
    adapter: hexo-icarus
    post_url: "https://notes.example.com/{slug}/"
  - id: vuepress
    name: VuePress
    repo: <owner>/my-vuepress-site
    branch: main
    posts_dir: docs/blog              # 侧边栏按目录自动生成时，文章放进对应子目录即可
    filename: "{category_dir}/{slug}.md"
    adapter: classic-vuepress
    post_url: "https://docs.example.com/blog/{category_dir}/{slug}.html"
    category_dirs:                    # 文章第一个分类 → 子目录
      ChatGPT: chatgpt
      Claude: claude
      Claude Code: claude
    default_category_dir: ai
